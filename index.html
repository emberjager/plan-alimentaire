<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E6A4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Plan alimentaire Stéphane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile-first carnet — onglets en barre basse, cartes de repas codées par couleur de catégorie (comme le PDF du coach) */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE8; --ink:#17201C; --muted:#5B6862; --line:#D9E0DB;
  --accent:#1E6A4E; --accent-ink:#FFFFFF; --guard:#C0262D; --guard-soft:#F8E3E3; --ok:#1E8A55; --ok-soft:#DDF1E6;
  --c-b:#D99520; --c-c:#3F87C2; --c-l:#26965F; --c-d:#8463C4;
  --g-n:#3B4FA8; --g-g:#7A1A1F; --g-a:#E3A82B;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111614; --surface:#19201D; --sunk:#222B27; --ink:#E6ECE8; --muted:#97A59E; --line:#2B3531;
  --accent:#5BC490; --accent-ink:#0D1A14; --guard:#F2636A; --guard-soft:#3A1C1E; --ok:#5BC490; --ok-soft:#183126;
  --c-b:#EDB24A; --c-c:#6BAEE3; --c-l:#4CC387; --c-d:#A88CE6; --g-n:#6E7FE8; --g-g:#B83C44; --g-a:#E8B54A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201D; --sunk:#222B27; --ink:#E6ECE8; --muted:#97A59E; --line:#2B3531;
  --accent:#5BC490; --accent-ink:#0D1A14; --guard:#F2636A; --guard-soft:#3A1C1E; --ok:#5BC490; --ok-soft:#183126;
  --c-b:#EDB24A; --c-c:#6BAEE3; --c-l:#4CC387; --c-d:#A88CE6; --g-n:#6E7FE8; --g-g:#B83C44; --g-a:#E8B54A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.sync{font-size:.75rem;color:var(--muted)}

/* header */
.top{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600;background:var(--sunk);color:var(--ink);border:1px solid transparent}
.chip.guard{background:var(--guard-soft);color:var(--guard)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.9rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.toggle-guard{border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:700;border:1.5px solid var(--line);background:var(--surface)}
.toggle-guard[aria-pressed="true"]{background:var(--guard);border-color:var(--guard);color:#fff}
.toggle-guard[data-gt="N"]{background:var(--g-n);border-color:var(--g-n)}
.toggle-guard[data-gt="G"]{background:var(--g-g);border-color:var(--g-g)}
.toggle-guard[data-gt="A"]{background:var(--g-a);border-color:var(--g-a);color:#1B1300}

/* planning */
.paint{display:flex;gap:6px;flex-wrap:wrap}
.paint button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.paint button i{width:10px;height:10px;border-radius:3px;display:inline-block}
.paint button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.7rem;text-align:center;color:var(--muted);font-weight:700;padding-bottom:2px}
.cell{min-height:70px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px 3px;display:flex;flex-direction:column;align-items:stretch;gap:2px;font-size:.8rem;min-width:0}
.cell .dn{text-align:center;font-weight:700}
.cell.out{opacity:.4}
.cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gt{font-size:.62rem;font-weight:800;border-radius:5px;padding:1px 2px;color:#fff;text-align:center;white-space:nowrap;overflow:hidden}
.gt-J{background:var(--guard)} .gt-N{background:var(--g-n)} .gt-G{background:var(--g-g)} .gt-A{background:var(--g-a);color:#1B1300}
.mk{font-size:.58rem;font-weight:700;border-radius:4px;padding:0 2px;text-align:center;white-space:nowrap;overflow:hidden}
.mk.cook{background:var(--ok-soft);color:var(--ok)}
.mk.drive{background:color-mix(in srgb,var(--c-c) 18%,var(--surface));color:var(--c-c)}
.agenda{display:flex;flex-direction:column}
.agenda .ag{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.88rem}
.agenda .ag:first-child{border-top:0}
.agenda ul{margin:0;padding-left:16px}
.remind{border-left:4px solid var(--c-c);background:color-mix(in srgb,var(--c-c) 8%,var(--surface));border-radius:0 var(--r) var(--r) 0;padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.remind ul{margin:0;padding-left:18px}

/* kcal bar */
.kbar{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;background:var(--sunk)}
.kbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* meals */
.meal{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 0;overflow:hidden}
.meal .band{border-radius:0 4px 4px 0}
.meal .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.meal .name{font-weight:700;font-size:1rem}
.meal .ings{font-size:.85rem;color:var(--muted)}
.meal .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.meal .tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.cat-B{--c:var(--c-b)} .cat-C{--c:var(--c-c)} .cat-L{--c:var(--c-l)} .cat-D{--c:var(--c-d)}
.band{background:var(--c)}
.catlabel{color:var(--c);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.07em}
.swap{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 9px;font-size:.78rem;font-weight:600;color:var(--muted)}
.swap:hover{color:var(--ink);border-color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);font-style:italic}

/* habits */
.habit{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.habit:first-of-type{border-top:0}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:var(--sunk);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:26px;height:32px;border-radius:4px 4px 8px 8px;border:1.5px solid var(--c-c);background:transparent;padding:0}
.glass.on{background:var(--c-c)}
.history{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:6px}
.history div{display:flex;flex-direction:column;gap:2px;align-items:center;font-size:.62rem;color:var(--muted)}
.history b{display:block;width:100%;height:6px;border-radius:2px;background:var(--sunk)}
.history b.s.on{background:var(--c-d)} .history b.w.on{background:var(--c-c)} .history b.a.on{background:var(--ok)}

/* week */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weeknav .mid{text-align:center;min-width:0}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.isguard{border-left:4px solid var(--guard)}
.dayline{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:baseline;font-size:.88rem}
.dayline button.link{border:0;background:none;padding:0;text-align:left;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.dayline button.link:hover{text-decoration-color:var(--ink)}
.dayline .k{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.session{border:1.5px dashed var(--accent);border-radius:var(--r);padding:12px 14px;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.session.warn{border-color:var(--guard);background:var(--guard-soft)}
.session ul{margin:6px 0 0;padding-left:18px}
.session li{margin:2px 0}

/* shopping */
.shopsum{display:flex;gap:10px;flex-wrap:wrap}
.shopsum .card{flex:1 1 140px}
.big{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.aisle h3{margin:14px 0 6px;font-size:.95rem}
.item{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.item label{flex:1;min-width:0;cursor:pointer}
.item .q{font-weight:700}
.item.done label{opacity:.45;text-decoration:line-through}
.item .price{font-size:.8rem;color:var(--muted);white-space:nowrap}

/* recipes */
.rgroup{display:flex;flex-direction:column;gap:8px}
details.recipe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);border-left:4px solid var(--c)}
details.recipe summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.recipe summary::-webkit-details-marker{display:none}
details.recipe .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
details.recipe ul{margin:0;padding-left:18px}
details.how{margin-top:4px}
details.how summary{cursor:pointer;font-size:.82rem;font-weight:700;color:var(--accent);list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"▸ "}
details.how[open] summary::before{content:"▾ "}
details.how ol{margin:6px 0 2px;padding-left:18px;font-size:.85rem;display:flex;flex-direction:column;gap:3px}

/* advice */
.advice{display:flex;flex-direction:column;gap:12px}
.advice .card{display:flex;flex-direction:column;gap:8px}
.advice ul{margin:0;padding-left:18px}
.advice li{margin:3px 0}
.hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.hand div{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.85rem}
.hand b{display:block;font-size:.9rem}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macro div{background:var(--sunk);border-radius:10px;padding:10px;text-align:center}
.macro b{display:block;font-family:var(--f-display);font-size:1.15rem}
.warnbox{border-left:4px solid var(--guard);padding:8px 12px;background:var(--guard-soft);border-radius:0 10px 10px 0;font-size:.88rem}

/* session guidée */
.progress{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.progress span{display:block;height:100%;background:var(--ok);transition:width .2s}
.phase{margin:20px 0 8px}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 10px;margin-bottom:8px}
.step.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step.done{opacity:.55}
.step.done .txt{text-decoration:line-through}
.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;font-weight:800;color:transparent}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.step .tags{font-size:.75rem;color:var(--muted)}
.timerbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 16px;pointer-events:none}
.timerbar[hidden]{display:none}
.tm{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:5px 5px 5px 14px;font-size:.85rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tm b{font-size:1rem}
.tm button{border:0;background:color-mix(in srgb,var(--bg) 22%,transparent);color:inherit;border-radius:999px;min-width:32px;height:32px;font-weight:700;padding:0 8px}
.tm.done{background:var(--guard);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* placard et tickets */
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 0}
.srow:first-of-type{border-top:0}
.srow .qty{font-weight:700;white-space:nowrap;text-align:right}
.lvl{font-size:.78rem;color:var(--muted)}
.lvl.warn{color:var(--guard);font-weight:600}
.lvl.ok{color:var(--ok)}
.field{font:inherit;font-size:16px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.tline{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.tline .full{grid-column:1/-1}
.tline .u{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
details.tk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.tk summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.tk summary::-webkit-details-marker{display:none}
details.tk .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.tk table{width:100%;border-collapse:collapse;font-size:.85rem}
.tk td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top}
.tk td:last-child{text-align:right;white-space:nowrap;padding-left:8px}
.aitxt{white-space:pre-wrap;font-size:.88rem;background:var(--sunk);border-radius:10px;padding:10px 12px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
nav.tabs button{border:0;background:none;padding:10px 0 9px;font-size:.62rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.dbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;color:var(--ink);font-size:.85rem;font-family:inherit}
.dbtn[aria-pressed="true"]{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.dbtn[aria-pressed="true"]::after{content:"✓";color:var(--ok);font-size:.8rem}
.dbtn:disabled{opacity:.55}
.dbtn small{font-weight:500;color:var(--muted);font-size:.7rem;text-align:center}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.trip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.trip button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 0;font:inherit;font-size:.78rem;font-weight:600;line-height:1.15;display:flex;flex-direction:column;align-items:center}
.trip button span{font-size:1rem;font-weight:700}
.trip button.in{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.trip button.end{background:var(--ok);border-color:var(--ok);color:#fff}
.mday{padding:8px 0;border-top:1px solid var(--line)}
.mday:first-child{border-top:0}
.mday .ml{display:flex;gap:8px;font-size:.88rem;padding:2px 0}
.mday .ml .k{color:var(--muted);min-width:5.2em;font-size:.8rem;padding-top:2px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.opt.cur{border-color:var(--accent)}
.opt .ings{font-size:.82rem;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.meal.skipped .body,.meal.skipped .band{opacity:.5}
.meal.skipped .name{text-decoration:line-through}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;padding:1px 7px;font-size:.72rem;font-weight:600;color:var(--muted);margin-left:4px}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pk{background:var(--surface);border:1.5px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pk.on{border-color:var(--ok);border-top-color:var(--c);box-shadow:inset 0 0 0 1px var(--ok)}
.pk b{font-size:.92rem;line-height:1.25}

.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}

.assign{font-size:.84rem;margin:8px 0 4px;padding-left:18px}

input[type=date]{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

function load(d){
  const v=d&&d.v; resetSubs();
  S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),d||{});
  let changed=false;
  if(v && v<2){ S.swaps={}; S.shop={}; }            // v1 → v2 : la rotation avait changé
  if(v && v<4){ // v4 : le plan démarre le jeudi 12 novembre, 1re session le 11 avec les courses du 9
    S.start="2026-11-12"; S.firstCook="2026-11-11"; S.bought="2026-11-09"; S.cook={}; S.shop={};
    if(S.seeded){ S.inv=S.inv.filter(e=>!(e.src==="liste"&&e.d==="2026-11-09")); if(!(S.receipts||[]).some(r=>r.d==="2026-11-09")) seedList(); }
    changed=true; }
  S.v=4;
  if(!S.seeded){ seedStock(); S.seeded=1; changed=true; }
  // v11 : les échanges « tous les 4 semaines » et le catalogue deviennent des choix jour par jour
  if(!S.v11){ migrateDP(); S.v11=1; changed=true; }

}

/* ---------- Logique du plan ---------- */
const startDate = () => parse(S.start);

const planWeek = d => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()), k=((Math.round((x-startDate())/864e5)%7)+7)%7; return addDays(x,-k); };
const dayOf = (ws,i) => DAYS[(addDays(ws,i).getDay()+6)%7];
const dShort = d => DAYS[(d.getDay()+6)%7].slice(0,3).toLowerCase()+". "+d.getDate();
const datesTxt = ds => !ds.length ? "" : ds.length===1 ? "repas du "+fmtLong(ds[0]) : "repas du "+fmtLong(ds[0])+" au "+fmtLong(ds[ds.length-1]);
// jours encore couverts par la session automatique n de la semaine ws
const rangeTxt = (ws,n) => datesTxt(sessionsFor(ws)["d"+n].map(i=>addDays(ws,i)));
function weekIndex(ws){ const diff=Math.round((ws-startDate())/864e5/7); return ((diff%4)+4)%4; }

const gType = d => { const v=S.guards[iso(d)]; return v===1||v===true?"J":(v||""); };
const nextType = t => t ? (GT_ORDER[GT_ORDER.indexOf(t)+1]||"") : "J";
function mealsFor(date){
  const ws=planWeek(date), w=weekIndex(ws), d=Math.round((date-ws)/864e5), slot=SLOT_OF_DAY[d], g=gType(date);
  const away = g==="J"||g==="G"; // absent toute la journée : collations sans frigo
  // semaine choisie dans le catalogue : tes choix (le reste = menu du coach) ; sinon tes échanges habituels
  const P=S.picks&&S.picks[iso(ws)], DP=(S.dp&&S.dp[iso(date)])||{}, sw=k=>DP[prefOf(k)]||(P?P[k]:S.swaps[w+"-"+k]);
  const b = sw("B"+slot) || BRK[w][slot];
  let cm = sw("CM"+slot), ca = sw("CA"+slot);
  const cmAuto = !cm, caAuto = !ca;
  // jour de garde : collations sans frigo si celle prévue en a besoin
  if(!cm) cm = CMS[w][slot]; if(!ca) ca = CAS[w][slot];
  const cmSub = away && cmAuto && !NOMADE.has(cm), caSub = away && caAuto && !NOMADE.has(ca);
  if(cmSub) cm = "C9"; if(caSub) ca = "C14";
  const l = sw("L"+slot) || LUNCH[w][slot];
  const dn = sw("D"+slot) || DINNER[w][slot];
  const portion = "Boîte "+(d-BLOCK_START[slot]+1)+"/"+BLOCK_LEN[slot];
  const m={w,d,ws,date,slot,g,away,portion,cmAuto,caAuto};
  m.list=fixList([
    {k:"B"+slot,r:b,cat:"B"},{k:"CM"+slot,r:cm,cat:"C",lab:"Collation du matin",nomade:away&&cmAuto},
    {k:"L"+slot,r:l,cat:"L"},{k:"CA"+slot,r:ca,cat:"C",lab:"Collation de l'après-midi",nomade:away&&caAuto},{k:"D"+slot,r:dn,cat:"D"}],m);
  return m;
}

/* ---------- Remplacements automatiques (toujours parmi les recettes du PDF, même catégorie, mêmes kcal)
   1. un ingrédient de ta liste « je n'en achète pas » → recette remplacée partout, et jamais dans la liste de courses
   2. jusqu'aux prochaines courses : un ingrédient absent du placard → recette remplacée par une que ton placard permet

function rawSnaps(){

  const lo=addDays(startDate(),-1), hi=C.end&&C.end>lo?C.end:lo, out={};
  RAW++; let cons; try{ cons=consumption(lo,hi); } finally{ RAW--; }
  const inv=S.inv.map((e,i)=>({e,i})).sort((a,b)=>a.e.d<b.e.d?-1:a.e.d>b.e.d?1:a.i-b.i);
  const s={}, add=e=>{ if(e.set) s[e.id]=e.q; else s[e.id]= s[e.id]===null?null:(s[e.id]||0)+e.q; };
  let k=0;
  for(let d=lo; d<=hi; d=addDays(d,1)){
    const D=iso(d), day=[];
    while(k<inv.length && inv[k].e.d<=D) day.push(inv[k++].e);
    day.filter(e=>!e.set).forEach(add);
    const snap=Object.assign({},s); day.filter(e=>e.set).forEach(e=>snap[e.id]=e.q); out[D]=snap;
    const c=cons[D]; if(c) for(const id in c){ const v=s[id]; if(v===undefined||v===null) continue; s[id]=Math.max(0,v-c[id]); }

const weekIngs = w => { const C=subCtx(); if(C.wk[w]) return C.wk[w]; const s=new Set(); [BRK,CMS,CAS,LUNCH,DINNER].forEach(T=>T[w].forEach(r=>Object.keys(R[r].i).forEach(i=>s.add(i)))); return C.wk[w]=s; };
// autre recette de la même catégorie : faisable avec le placard, qui reprend les ingrédients de la semaine
function pickAlt(x,m,snap,prevC){

  Object.keys(R).forEach(id=>{
    if(R[id].c!==x.cat||id===x.r||banned(id).length) return;
    const ings=Object.keys(R[id].i);
    let sc=(snap?-100*missIn(id,snap).length:0) + 10*ings.filter(i=>wk.has(i)).length/ings.length;
    if(x.nomade) sc+=NOMADE.has(id)?50:0;

function fixMeal(x,m,prevC){

  if(!ban.length) return x;

  if(!ban.length && altMiss.length) return Object.assign({},x,{miss}); // rien de mieux au placard : on garde la recette prévue
  return Object.assign({},x,{r:alt,miss:altMiss,sub:{from:x.r,why:ban.length?"tu n'aimes pas : "+ingNames(ban):"il manque "+ingNames(miss)}});

function fixList(list,m){

/* Disponibilité d'un jour pour cuisiner ou aller au drive :
   3 libre · 2 astreinte ou lendemain de nuit · 1 jour de nuit (matin) ou lendemain de 24 h · 0 garde de jour / 24 h */
function freeScore(d){
  const t=gType(d), p=gType(addDays(d,-1));
  let s = t==="J"||t==="G" ? 0 : t==="N" ? 1 : t==="A" ? 2 : 3;
  if(p==="G") s=Math.min(s,1); else if(p==="N") s=Math.min(s,2);
  return s;
}
function pickBest(cands){ let best=null,bs=0; cands.forEach(d=>{ const s=freeScore(d); if(s>bs){bs=s;best=d;} }); return best; }

/* ---------- Sessions « Je cuisine » : tu choisis les jours à préparer ----------
   S.custom = [{id, date (jour où tu cuisines), days:[jours mangés], parts:{B, C, L, D}}]
   B = petits-déjeuners, C = collations, L = déjeuners, D = dîners (ancien format : LD = déjeuners et dîners).
   Si une session prépare le déjeuner d'un jour mais pas son dîner (ou l'inverse), l'autre est cuisiné frais ce jour-là. */
const FRIDGE_DAYS = 4; // au-delà, les boîtes vont au congélateur
const customs = () => (S.custom||[]).filter(c=>c.days&&c.days.length);
// jours couverts par une session « Je cuisine » pour une partie : {iso: session}
const hasP = (c,p) => p==="LD" ? hasP(c,"L")||hasP(c,"D") : !!(c.parts[p]||((p==="L"||p==="D")&&c.parts.LD));
// LD = jours dont le déjeuner ou le dîner est pris en charge par « Je cuisine » (ils sortent des sessions prévues)
function coverOf(part){ const o={}; customs().forEach(c=>{ if(hasP(c,part)) c.days.forEach(d=>{ if(!o[d]) o[d]=c; }); }); return o; }
const covers = () => ({LD:coverOf("LD"),L:coverOf("L"),D:coverOf("D"),B:coverOf("B"),C:coverOf("C")});

/* Repas pas mangés : S.skip["2026-11-16|L0"] = {why, made, box}
   made 0 : rien n'avait été cuisiné, les aliments restent au placard (et la session en prépare un de moins)
   made 1 : une boîte ou un pot était prêt ; box = less (finalement pas cuisinée) · spare (mangée un autre jour) · freeze · trash

const slotKey = (d,p) => p+SLOT_OF_DAY[Math.round((parse(d)-planWeek(parse(d)))/864e5)];

function sessionsFor(ws){
  const st=startDate(), lo=addDays(st,-1), ok=a=>a.filter(d=>d>=lo); // au plus tôt la veille du début du plan
  const first = iso(ws)===iso(st), cov=coverOf("LD");

  const moved = (r,n) => { const f=addDays(ws,r[0]); let c=ok([addDays(f,-1),f]); if(!started(sessionKey(ws,n))){ const fut=c.filter(d=>d>=TODAY); if(fut.length) c=fut; } return pickBest(c); };
  const s1 = !d1.length ? null : d1[0]!==0 ? moved(d1,1) : first&&S.firstCook ? parse(S.firstCook) : pickBest(ok([addDays(ws,-1),ws]));
  const s2 = !d2.length ? null : d2[0]!==4 ? moved(d2,2) : pickBest([addDays(ws,3),addDays(ws,2)]);
  // drive : la veille de la session 1 si possible, sinon le matin même (1re semaine : courses déjà faites)
  let drive=null;
  if(first&&S.bought) drive=parse(S.bought);
  else if(s1){ const v=addDays(s1,-1); drive = (v>=lo && freeScore(v)>=1) ? v : s1; }
  else drive = pickBest([addDays(ws,-1),addDays(ws,-2),ws]);

// viande et poisson de la session 2 : à congeler au retour du drive
function freezeList(ws,k){
  const need={};
  sessionsFor(ws).d2.forEach(i=>{ const day=addDays(ws,i), m=mealsFor(day); m.list.filter(x=>(x.cat==="L"||x.cat==="D")&&!notCooked(iso(day),x.k)).forEach(x=>Object.entries(R[x.r].i).forEach(([id,q])=>{ const a=ING[id][1]; if(a==="viande"||a==="poisson") need[id]=(need[id]||0)+q; })); });
  return Object.entries(need).map(([id,q])=>SHORT[id]+" "+q+" g");

// tout ce qui tombe un jour donné : garde, session, drive, commande, décongélation
function eventsOn(date){

    if(ws<startDate()) return;
    const s=sessionsFor(ws), fz=(s.s2&&s.drive&&Math.round((s.s2-s.drive)/864e5)>=3)?freezeList(ws,s.d2.length):[];
    if(s.s1 && iso(s.s1)===k) ev.tasks.push({t:"cook",n:1,ws});
    if(s.s2 && iso(s.s2)===k) ev.tasks.push({t:"cook",n:2,ws});
    if(s.drive && iso(s.drive)===k) ev.tasks.push({t:"drive",ws,fz});
    if(s.drive && iso(addDays(s.drive,-1))===k) ev.tasks.push({t:"order",ws});
    if(s.s2 && fz.length && iso(addDays(s.s2,-1))===k) ev.tasks.push({t:"thaw",ws,fz});

// contenu d'une session automatique : seulement les jours qui ne sont pas déjà préparés
function sessionContent(ws,which){
  const w=weekIndex(ws), keep=new Set(sessionsFor(ws)["d"+which]), slots = which===1?[0,1]:[2], days = which===1?[0,1,2,3]:[4,5,6], covC=coverOf("C");
  const items=[];
  slots.forEach(s=>{
    const dd=Array.from({length:BLOCK_LEN[s]},(_,i)=>BLOCK_START[s]+i).filter(i=>keep.has(i)); if(!dd.length) return;
    // un repas sauté à l'avance ou remplacé par une boîte en plus : une boîte de moins
    // un même plat sur plusieurs jours = cuisiné en une fois
    [["L",2],["D",4]].forEach(([c,j])=>{ const g={};
      dd.filter(i=>!notCooked(iso(addDays(ws,i)),c+s)).forEach(i=>{ const day=addDays(ws,i), r=mealsFor(day).list[j].r; (g[r]=g[r]||[]).push(day); });
      Object.entries(g).forEach(([r,dates])=>items.push({r,p:dates.length,dates})); });
  });
  let balls=0, eggs=0, eggsC=0;
  days.forEach(d=>{ const day=addDays(ws,d), m=mealsFor(day), cC=covC[iso(day)];
    m.list.forEach(x=>{ if(notCooked(iso(day),x.k)) return; if(x.cat==="C" && !cC){ if(x.r==="C11") balls++; if(x.r==="C5"){ eggs+=2; eggsC+=2; } } if((x.cat==="L"||x.cat==="D") && keep.has(d) && R[x.r].i.oeuf) eggs+=R[x.r].i.oeuf; }); });
  return {items,extra:[],balls,eggs,eggsC,freeze:[]};
}
// contenu d'une session « Je cuisine »
function customContent(c){
  const byR={}, ex={}, add=(o,r,day)=>{ const x=o[r]=o[r]||{r,p:0,dates:[]}; x.p++; x.dates.push(day); };
  let balls=0, eggs=0, eggsC=0; const freeze=[];
  c.days.forEach(d=>{ const day=parse(d); if(day<startDate()) return; const m=mealsFor(day);
    if(hasP(c,"LD") && isFrozen(c,d)) freeze.push(day);
    m.list.forEach(x=>{
      if(notCooked(d,x.k)) return;
      if((x.cat==="L"||x.cat==="D") && hasP(c,x.cat)){ add(byR,x.r,day); if(R[x.r].i.oeuf) eggs+=R[x.r].i.oeuf; }
      if(x.cat==="B" && c.parts.B) add(ex,x.r,day);
      if(x.cat==="C" && c.parts.C){ if(x.r==="C11") balls++; else if(x.r==="C5"){ eggs+=2; eggsC+=2; } else add(ex,x.r,day); }
    });

  return {items:Object.values(byR),extra:Object.values(ex),balls,eggs,eggsC,freeze,fzBoxes:freeze.length*((hasP(c,"L")?1:0)+(hasP(c,"D")?1:0))};
}

/* ---------- Prix : ceux de tes tickets remplacent les estimations ---------- */
const fmts = id => { const b=ING[id][3]; return Array.isArray(b)?b:[b]; };
const defUP = id => { const f=fmts(id)[0]; return f.p/(f.s||f.pw); };           // prix repère par g, ml ou pièce
const UP = id => (S.up&&S.up[id]) || defUP(id);
const fmtPrice = (id,f) => S.up&&S.up[id] ? Math.round(S.up[id]*(f.s||f.pw)*100)/100 : f.p;
// combinaison de formats la moins chère qui couvre q
function packs(id,q){
  const fm=fmts(id);
  if(fm[0].pw){ const f=fm[0], n=Math.max(1,Math.ceil(q/f.pw-1e-9)); return {label:n+" "+(n>1?f.w[1]:f.w[0]),price:n*fmtPrice(id,f),units:n*f.pw}; }
  const [a,b]=fm;
  if(!b){ const n=Math.max(1,Math.ceil(q/a.s-1e-9)); return {label:n+" × "+a.l,price:n*fmtPrice(id,a),units:n*a.s}; }
  let best=null; const pa=fmtPrice(id,a), pb=fmtPrice(id,b);
  for(let i=0;i<=Math.ceil(q/a.s);i++) for(let j=0;j<=Math.ceil(q/b.s);j++){
    if((i||j)===0||i*a.s+j*b.s<q) continue; const c=i*pa+j*pb; if(!best||c<best.c) best={c,i,j};
  }
  return {label:[best.j?best.j+" × "+b.l:"",best.i?best.i+" × "+a.l:""].filter(Boolean).join(" + "),price:best.c,units:best.i*a.s+best.j*b.s};
}
const fq = (id,q) => {
  const u=ING[id][2]; q=Math.round(q);
  if(u==="pc") return id==="oeuf"?(q>1?q+" œufs":q+" œuf"):q+" "+(id==="galettes"?"galettes":"pièces");
  return q>=1000 ? (q/1000).toLocaleString("fr-FR",{maximumFractionDigits:2})+(u==="ml"?" L":" kg") : q+" "+u;
};
const euro = n => (Math.round(n*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";

// jour où un repas sort du placard : jour de la session qui le prépare, sinon le jour même
function whenUsed(day,m,x,s,cv){
  const k=iso(day), c=cv[x.cat][k];
  if(c) return parse(c.date);
  if((x.cat==="L"||x.cat==="D") && cv.LD[k]) return day; // cuisiné frais ce jour-là
  if(x.cat==="L"||x.cat==="D") return m.slot<2 ? (s.s1||m.ws) : (s.s2||addDays(m.ws,4));
  return day;
}
// besoins de la semaine ws. Avec cut : tout ce qui sera cuisiné ou mangé entre ces courses et les suivantes
// (une grosse préparation qui déborde sur la semaine d'après est comptée ici)
// (menu du PDF : ce qui manque au placard est à acheter, sauf ta liste « je n'en achète pas »)
function needsFor(ws,cut){
  const need={}; RAW++;
  try{
    if(cut){ Object.values(consumption(cut,addDays(weekCut(addDays(ws,7)),-1))).forEach(o=>Object.entries(o).forEach(([id,q])=>need[id]=(need[id]||0)+q)); return need; }
    for(let d=0; d<7; d++) mealsFor(addDays(ws,d)).list.forEach(x=>Object.entries(R[x.r].i).forEach(([id,q])=>need[id]=(need[id]||0)+q));
    return need;
  } finally { RAW--; }
}
// ce que le menu retire du placard, jour par jour : plats préparés le jour de la session, le reste le jour même
function consumption(from,to){
  const out={}, st=startDate(), lo=addDays(st,-1); if(to<lo) return out;
  const a=from<lo?lo:from, cv=covers();
  for(let ws=planWeek(a); ws<=addDays(to,14); ws=addDays(ws,7)){
    if(ws<st) continue;
    const s=sessionsFor(ws);
    for(let d=0; d<7; d++){
      const day=addDays(ws,d), m=mealsFor(day);
      m.list.forEach(x=>{
        if(notCooked(iso(day),x.k)) return; // pas mangé et pas cuisiné : les aliments restent au placard
        const when=whenUsed(day,m,x,s,cv);
        if(when<a||when>to) return;
        const o=out[iso(when)]=out[iso(when)]||{};
        Object.entries(R[x.r].i).forEach(([id,q])=>o[id]=(o[id]||0)+q);
      });
    }
  }
  return out;
}
// stock en fin de journée asOf ; les achats sont comptés jusqu'à buyUntil
function stockAt(asOf,buyUntil){
  const A=iso(asOf), B=iso(buyUntil&&buyUntil>asOf?buyUntil:asOf), ev=[], cons=consumption(addDays(startDate(),-1),asOf);
  S.inv.forEach((e,i)=>{ if(e.d<=B) ev.push({d:e.d,o:e.set?2:0,i,e}); });
  for(const d in cons) ev.push({d,o:1,i:0,c:cons[d]});
  ev.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:(x.o-y.o)||(x.i-y.i));
  const s={}, short={};
  ev.forEach(x=>{
    if(x.c){ for(const id in x.c){ const v=s[id]; if(v===undefined||v===null) continue; const n=v-x.c[id]; if(n<-0.5) short[id]=x.d; s[id]=Math.max(0,n); } }
    else if(x.e.set) s[x.e.id]=x.e.q;
    else s[x.e.id]= s[x.e.id]===null ? null : (s[x.e.id]||0)+x.e.q;
  });
  return {s,short};
}

function shoppingFor(ws){

const sessionKey = (ws,n) => iso(ws)+"|"+n;
const sessionDone = key => { if(S.done&&key in S.done) return !!S.done[key]; const B=buildSession(key); if(!B) return false; const d=S.cook[key]||{}; return B.steps.length && B.steps.every(s=>d[s.id]); };
// « Préparée le … » ou « Boîte 2/3 » pour un déjeuner ou un dîner
// la session qui prépare ce repas : {key, date} ; null = rien à préparer à l'avance
function prepOf(m,x){
  const k=iso(m.date), cv=covers(), c=cv[x.cat][k];
  if(c) return {key:c.id,date:parse(c.date),custom:c};
  if(x.cat!=="L"&&x.cat!=="D") return null;
  if(cv.LD[k]) return {key:"F"+k+"|"+x.cat,date:m.date,fresh:1};
  const n=m.slot<2?1:2, d=sessionsFor(m.ws)["s"+n]; return d?{key:sessionKey(m.ws,n),date:d}:null;
}
function portionTxt(m,x){
  if(x){ const p=prepOf(m,x); if(!p) return "";
    if(p.fresh) return x.cat==="D"?"À cuisiner le soir":"À cuisiner le midi";
    if(sessionDone(p.key)) return (p.custom&&isFrozen(p.custom,iso(m.date))?"Congelée ✓":"Boîte prête ✓");
    if(iso(p.date)===iso(TODAY)) return "À cuisiner aujourd'hui";
    return p.date<TODAY ? "Cuisine du "+dShort(p.date)+" pas confirmée" : "Cuisinée "+dShort(p.date); }
  const k=iso(m.date), cv=covers(), c=x?cv[x.cat][k]:cv.LD[k];
  if(x && !c && cv.LD[k]) return x.cat==="D"?"À cuisiner le soir":"À cuisiner le midi";
  if(c) return (isFrozen(c,k)?"Congelée · ":"")+"Préparée "+(c.date===k?"le jour même":"le "+fmt(parse(c.date)));
  const r=sessionsFor(m.ws)["d"+(m.slot<2?1:2)].filter(i=>SLOT_OF_DAY[i]===m.slot);
  return "Boîte "+(r.indexOf(m.d)+1)+"/"+r.length;
}

// tout ce que demandent les repas de la semaine (sauf ceux pas mangés et pas cuisinés)
// les jours de tes courses : du … au … (par défaut, de demain à dans 7 jours)
function tripNow(){
  const T=S.trip; if(T&&T.to>=iso(TODAY)) return T;
  return {from:iso(addDays(TODAY,1)),to:iso(addDays(TODAY,7))};
}
const tripKey = T => T.from+"|"+T.to;
const tripDays = T => { const a=[]; for(let d=parse(T.from); d<=parse(T.to); d=addDays(d,1)) a.push(d); return a; };
function weekNeeds(T){
  const need={};
  tripDays(T).forEach(day=>{ if(day<startDate()) return; mealsFor(day).list.forEach(x=>{ if(notCooked(iso(day),x.k)) return; Object.entries(R[x.r].i).forEach(([id,q])=>need[id]=(need[id]||0)+q); }); });
  return need;
}
// j'en ai déjà ? ce que tu as coché ; sinon, pour les produits qui durent (riz, huile, miel…), oui si tu les avais aux dernières courses
function hasIt(T,id){
  const H=S.have&&S.have[tripKey(T)]; if(H&&id in H) return !!H[id];
  if(!ING[id][4]) return false;
  const lim=iso(addDays(parse(T.from),-35));
  const prev=Object.keys(S.have||{}).filter(k=>{ const f=k.split("|")[0]; return f<T.from&&f>=lim&&id in S.have[k]; }).sort();
  if(prev.length) return !!S.have[prev[prev.length-1]][id];
  return OWNED.includes(id);
}
// unité du compteur « J'en ai » : pièces (bananes, œufs…) ou paquets (riz, skyr, poulet…)
function cntUnit(id){
  const f=fmts(id)[0];
  if(f.pw) return {size:f.pw,t:n=>n+" "+(n>1?f.w[1]:f.w[0])};
  if(ING[id][2]==="pc") return {size:1,t:n=>fq(id,n)};
  const a=fmts(id).reduce((m,x)=>x.s<m.s?x:m);
  return {size:a.s,t:n=>n+" × "+a.l};
}
const cntOf = (T,id) => { const C=S.cnt&&S.cnt[tripKey(T)]; return C&&id in C ? C[id] : null; };
function shopList(T){
  return Object.entries(weekNeeds(T)).map(([id,q])=>{
    const n=cntOf(T,id), u=cntUnit(id);
    let have, rest=q;
    if(n!==null){ rest=Math.max(0,q-n*u.size); have=rest<=1e-9; }
    else have=hasIt(T,id);
    const p=packs(id,have?q:rest);
    return {id,name:ING[id][0],aisle:ING[id][1],q,need:fmts(id)[0].pw?u.t(Math.ceil(q/u.size-1e-9)):fq(id,q),label:p.label,price:p.price,have,keep:!!ING[id][4],n,u,part:n!==null&&n>0&&!have};
  });
}

function analyze(rc){
  const tips=[], off=[]; let est=0, plan=0, offSum=0;
  const d=parse(rc.d), cons=consumption(d,addDays(d,13)), need={};
  Object.values(cons).forEach(o=>Object.entries(o).forEach(([id,q])=>need[id]=(need[id]||0)+q));
  const bought={};
  rc.lines.forEach(([lab,id,q,p])=>{
    if(!id){ offSum+=p; off.push(lab); return; }
    plan+=p; if(q>0){ est+=defUP(id)*q; bought[id]=(bought[id]||0)+q;
      const pu=p/q, du=defUP(id);
      if(pu>du*1.25 && p>1) tips.push(`${SHORT[id]} : payé ${perTxt(id,pu)}, le repère est ${perTxt(id,du)}. Regarde la marque du magasin ou un plus grand format.`);
    }
  });
  Object.entries(bought).forEach(([id,q])=>{ if(!LONG.has(id) && q>(need[id]||0)*1.5+fmts(id)[0].s*0 && q-(need[id]||0)>((fmts(id)[0].s||fmts(id)[0].pw)||0)) tips.push(`${SHORT[id]} : ${fq(id,q)} achetés, le menu n'en utilise que ${fq(id,need[id]||0)} sur 2 semaines. Risque de gaspillage : congèle le surplus ou prends un plus petit format.`); });
  if(offSum>0) tips.push(`${euro(offSum)} d'articles hors plan (${off.slice(0,4).map(x=>x.toLowerCase()).join(", ")}${off.length>4?"…":""}). C'est permis, mais c'est la première source d'économie.`);
  return {est,plan,offSum,tips};
}

function toDraft(data){

    const id=l&&ING[l.id]?l.id:""; let q=n(l&&l.quantite);
    if(id && !(q>0)){ const f=fmts(id)[0]; q=f.s||f.pw; }
    return {label:String((l&&l.libelle)||"").slice(0,60),id,q:id?Math.round(q):"",price:n(l&&l.prix)??""};
  }).filter(l=>l.label||l.price!=="");
  const d=data&&/^\d{4}-\d{2}-\d{2}$/.test(data.date||"")?data.date:iso(TODAY);
  return {store:String((data&&data.magasin)||"").slice(0,40),d,total:n(data&&data.total),lines};
}

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file), k=Math.min(1,2600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    let q=0.88, b=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
    while(b && imgMax && b.size>imgMax && q>0.4){ q-=0.15; b=await new Promise(r=>c.toBlob(r,"image/jpeg",q)); }
    return b||file;
  }catch(e){ return file; }
}

let timers=[]; try{ timers=JSON.parse(localStorage.getItem("plan-timers")||"[]").filter(t=>t.end>Date.now()-36e5); }catch(e){}
let actx=null;
const saveTimers = () => { try{ localStorage.setItem("plan-timers",JSON.stringify(timers)); }catch(e){} };
function unlockAudio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(){
  try{ unlockAudio(); const t0=actx.currentTime; [0,.35,.7].forEach(dt=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.0001,t0+dt); g.gain.exponentialRampToValueAtTime(.35,t0+dt+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.3); o.start(t0+dt); o.stop(t0+dt+.32); }); }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]); }catch(e){}
}
function renderTimers(){
  const el=document.getElementById("timerBar"); if(!el) return;
  if(!timers.length){ el.hidden=true; el.innerHTML=""; return; }
  const now=Date.now(); el.hidden=false;
  el.innerHTML=timers.map(t=>{ const left=Math.max(0,Math.round((t.end-now)/1000)), fin=left<=0;
    return `<div class="tm ${fin?"done":""}"><span>${esc(t.label)}</span><b class="num">${fin?"C'est prêt !":Math.floor(left/60)+":"+pad(left%60)}</b><button data-tstop="${esc(t.id)}" aria-label="${fin?"Arrêter l'alarme":"Annuler le minuteur"}">${fin?"OK":"✕"}</button></div>`; }).join("");
}
setInterval(()=>{
  const now=Date.now(); let ring=false;
  timers.forEach(t=>{ if(t.end<=now && (!t.rang || (t.rang<4 && now-t.rang>=20000))){ t.rang=now; t.rings=(t.rings||0)+1; if(t.rings>=4) t.rang=4; ring=true; } });
  if(ring){ beep(); saveTimers(); }
  renderTimers();
},1000);

  if(t.dataset.dataimp){ openImport(); return; }
  if(t.dataset.dataimpgo){ dataImport(); return; }
  if(t.dataset.dislike){ const id=t.dataset.dislike; S.ban=S.ban||{}; if(S.ban[id]) delete S.ban[id]; else S.ban[id]=1; view.dislikeOpen=1; save(); render(); return; }
  if(t.dataset.skwhy){ view.sk.why=t.dataset.skwhy; openSkip(); return; }
  if(t.dataset.skbox){ view.sk.box=t.dataset.skbox; openSkip(); return; }
  if(t.dataset.skgo){ doSkip(); return; }
  if(t.dataset.unskip){ unskip(t.dataset.unskip); return; }
  if(t.dataset.spopen){ openSpare(t.dataset.spopen); return; }
  if(t.dataset.spuse){ const [id,d,k]=t.dataset.spuse.split("|"), sp=S.spare.find(s=>s.id===id); if(sp) sp.use=d+"|"+k; save(); closeSheet(); render(); return; }
  if(t.dataset.spundo){ const sp=(S.spare||[]).find(s=>s.id===t.dataset.spundo); if(sp) sp.use=null; save(); render(); return; }
  if(t.dataset.spfz){ const sp=S.spare.find(s=>s.id===t.dataset.spfz); if(sp) sp.where="congel"; save(); openSpare(sp.id); render(); return; }
  if(t.dataset.spdel){ S.spare=S.spare.filter(s=>s.id!==t.dataset.spdel); save(); closeSheet(); render(); return; }
  if(t.dataset.mp){ view.mp=initMP(t.dataset.mp); if(view.tab!=="menu") view.prev=view.tab; view.tab="menu"; render(); window.scrollTo(0,0); return; }
  if(t.dataset.mpw){ const n=addDays(parse(view.mp.ws),7*(+t.dataset.mpw)); view.mp=initMP(iso(n)); render(); return; }
  if(t.dataset.mpp){ const [c,id]=t.dataset.mpp.split("|"); view.mp.sel[c].push(id); render(); return; }
  if(t.dataset.mpm){ const [c,id]=t.dataset.mpm.split("|"), a=view.mp.sel[c], i=a.lastIndexOf(id); if(i>=0) a.splice(i,1); render(); return; }
  if(t.dataset.mpclear){ Object.keys(view.mp.sel).forEach(c=>view.mp.sel[c]=[]); render(); return; }
  if(t.dataset.mpcoach){ const ws=parse(view.mp.ws), w=weekIndex(ws); Object.entries(PICK_KEYS).forEach(([c,keys])=>view.mp.sel[c]=keys.filter(k=>!lockedKey(ws,k)).map(k=>defaultFor(w,k))); render(); return; }
  if(t.dataset.mpgo){ saveMP(); view.week=parse(view.mp.ws); view.tab="shop"; view.mp=null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.mpreset){ delete S.picks[view.mp.ws]; save(); view.mp=initMP(view.mp.ws); render(); return; }
  if(t.dataset.ban){ S.ban=S.ban||{}; S.ban[t.dataset.ban]=1; save(); closeSheet(); render(); return; }
  if(t.dataset.unban){ delete S.ban[t.dataset.unban]; save(); render(); return; }
  if(t.dataset.banadd){ openBan(); return; }
  if(t.id==="closeSheet"){ closeSheet(); return; }
  // je cuisine
  if(t.dataset.jc){ view.jc=null; openJC(); return; }
  if(t.dataset.jcd){ const J=view.jc; J.date=t.dataset.jcd; J.days=J.days.filter(d=>d>=J.date); openJC(); return; }
  if(t.dataset.jcq!==undefined){ view.jc.days=t.dataset.jcq?t.dataset.jcq.split(","):[]; openJC(); return; }
  if(t.dataset.jcday){ const J=view.jc, k=t.dataset.jcday; J.days=J.days.includes(k)?J.days.filter(d=>d!==k):[...J.days,k].sort(); openJC(); return; }
  if(t.dataset.jcp){ const P=view.jc.parts, k=t.dataset.jcp; P[k]=P[k]?0:1; openJC(); return; }
  if(t.dataset.jcgo){ const J=view.jc; if(!J||!J.days.length) return; const id="c"+Date.now().toString(36);
    S.custom=S.custom||[]; S.custom.push({id,date:J.date,days:[...J.days].sort(),parts:{...J.parts}}); save(); closeSheet();
    unlockAudio(); view.prev=view.tab==="cook"?view.prev:view.tab; view.cook=id; view.tab="cook"; render(); window.scrollTo(0,0); return; }
  if(t.dataset.cdel){ const id=t.dataset.cdel; if(view.cdelArm!==id){ view.cdelArm=id; render(); return; }
    S.custom=(S.custom||[]).filter(c=>c.id!==id); delete S.cook[id]; view.cdelArm=null; save(); render(); return; }
  if(t.dataset.habit){ const d=iso(TODAY); const h=S.habits[d]=S.habits[d]||{}; h[t.dataset.habit]=h[t.dataset.habit]?0:1; save(); render(); return; }
  if(t.dataset.water){ const d=iso(TODAY); const h=S.habits[d]=S.habits[d]||{}; const n=+t.dataset.water; h.w=(h.w===n?n-1:n); save(); render(); return; }
  if(t.id==="hideDone"){ view.hideDone=!view.hideDone; render(); return; }
  if(t.id==="resetShop"){ delete S.shop[iso(view.week)]; save(); render(); return; }
  if(t.id==="copyList"){
    const T=tripNow(), list=shopList(T).filter(x=>!x.have);
    const groups={}; list.forEach(x=>(groups[x.aisle]=groups[x.aisle]||[]).push(x));
    let txt="Courses du "+fmtLong(parse(T.from))+" au "+fmtLong(parse(T.to))+"\n";
    Object.keys(AISLES).forEach(g=>{ if(!groups[g])return; txt+="\n"+AISLES[g]+"\n"; groups[g].forEach(x=>{ txt+="- "+x.name+" : "+x.label+"\n"; }); });
    try{ await navigator.clipboard.writeText(txt); $("#copyMsg").textContent="Liste copiée"; }
    catch(_){ $("#copyMsg").textContent="Copie impossible ici : sélectionne la liste à la main"; }
    return;
  }
  if(t.id==="shopToStock"){
    const k=iso(view.week), c=S.shop[k]||{}, d=iso(TODAY);
    shoppingFor(view.week).forEach(x=>{ if(c[x.id]&&x.rest>0){ S.inv.push({d,id:x.id,q:x.units,src:"liste"}); delete c[x.id]; } });
    save(); render(); return;
  }
  // session guidée
  if(t.dataset.cook){ unlockAudio(); view.prev=view.tab==="cook"?view.prev:view.tab; view.cook=t.dataset.cook; view.tab="cook"; render(); window.scrollTo(0,0); return; }
  if(t.dataset.step){ unlockAudio(); const k=view.cook, c=S.cook[k]=S.cook[k]||{}, id=t.dataset.step; if(c[id]) delete c[id]; else c[id]=1; save(); render(); return; }
  if(t.dataset.cookreset){ delete S.cook[view.cook]; save(); render(); return; }
  if(t.dataset.timer){ unlockAudio(); const [id,min,...lab]=t.dataset.timer.split("|"); timers=timers.filter(x=>x.id!==id); timers.push({id,label:lab.join("|"),end:Date.now()+(+min)*60000}); saveTimers(); render(); return; }
  if(t.dataset.tstop){ timers=timers.filter(x=>x.id!==t.dataset.tstop); saveTimers(); if(view.tab==="cook") render(); else renderTimers(); return; }
  // recettes / conseils
  if(t.dataset.sub){ view.rsub=t.dataset.sub; render(); return; }
  // placard
  if(t.dataset.inv){ openInv(t.dataset.inv); return; }
  if(t.dataset.invadd){ openInv(null); return; }
  if(t.dataset.invsave!==undefined){
    const q=parseFloat(($("#invQty").value||"").replace(",",".")); if(!(q>=0)){ $("#invQty").focus(); return; }
    const id=t.dataset.invsave||$("#invSel").value;
    if(t.dataset.invsave) invSet(id,q); else { S.inv.push({d:iso(TODAY),id,q,src:"manuel"}); save(); }
    closeSheet(); render(); return;
  }
  if(t.dataset.invzero){ invSet(t.dataset.invzero,0); closeSheet(); render(); return; }
  if(t.dataset.invunk){ invSet(t.dataset.invunk,null); closeSheet(); render(); return; }
  // tickets
  if(t.dataset.tkmanual){ view.draft={store:"",d:iso(TODAY),total:null,lines:[{label:"",id:"",q:"",price:""}]}; render(); return; }
  if(t.dataset.dladd){ view.draft.lines.push({label:"",id:"",q:"",price:""}); render(); return; }
  if(t.dataset.dlrm){ view.draft.lines.splice(+t.dataset.dlrm,1); render(); return; }
  if(t.dataset.dcancel){ view.draft=null; render(); return; }
  if(t.dataset.dsave){ saveDraft(); window.scrollTo(0,0); return; }
  if(t.dataset.tkdel){ const id=t.dataset.tkdel; if(view.delArm!==id){ view.delArm=id; render(); return; }
    S.receipts=S.receipts.filter(r=>r.id!==id); S.inv=S.inv.filter(e=>e.src!==id); view.delArm=null; save(); render(); return; }
  if(t.dataset.tkai){ if(!view.aiBusy) askTips(t.dataset.tkai); return; }
});
document.addEventListener("input",e=>{
  const t=e.target, dr=view.draft; if(!dr) return;
  if(t.dataset.df){ dr[t.dataset.df]=t.dataset.df==="total"?(t.value===""?null:t.value):t.value; return; }
  if(t.dataset.dl){ const [i,f]=t.dataset.dl.split("|"); if(f!=="id"){ dr.lines[+i][f]=t.value; const el=$("#dsum"); if(el&&f==="price") el.textContent="Somme des lignes : "+euro(draftSum()); } }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="tkFile" && t.files && t.files[0]){ readReceipt(t.files[0]); t.value=""; return; }
  if(t.id==="invSel"){ const u=ING[t.value][2]; $("#invUnit").textContent="("+(u==="pc"?"pièces":u)+")"; return; }
  if(t.dataset.dl && t.dataset.dl.endsWith("|id")){ const l=view.draft.lines[+t.dataset.dl.split("|")[0]]; l.id=t.value; if(l.id&&!(+l.q>0)){ const f=fmts(l.id)[0]; l.q=Math.round(f.s||f.pw||1); } render(); return; }
  if(t.dataset.item){ const k=iso(view.week); const c=S.shop[k]=S.shop[k]||{}; if(t.checked) c[t.dataset.item]=1; else delete c[t.dataset.item]; save(); render(); return; }
  if(t.id==="startDate" && t.value){ S.start=t.value; S.firstCook=""; S.bought=""; save(); render(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
function fromHash(){ const h=(location.hash||"").slice(1); if(h==="advice"){ view.tab="recipes"; view.rsub="advice"; } else if(TABS.some(([k])=>k===h)) view.tab=h; }
window.addEventListener("hashchange",()=>{ fromHash(); render(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&view.tab==="cook") keepAwake(true); });
try{ const raw=localStorage.getItem("plan-stephane"); load(raw?JSON.parse(raw):{}); }catch(e){ load({}); }
fromHash();
render();
initDb();
initSample();
ghStart();
</script>
